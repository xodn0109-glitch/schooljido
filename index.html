<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>교내 일과 지도 담당 교사</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#F4F7F6;min-height:100vh;color:#333}
header{background:linear-gradient(135deg,#4FACFE 0%,#00F2FE 100%);color:#fff;padding:20px;text-align:center;box-shadow:0 4px 15px rgba(0,242,254,.25)}
header h1{font-size:1.3rem;font-weight:800;margin-bottom:6px;letter-spacing:.5px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
header p{font-size:0.85rem;opacity:.95;font-weight:500}
.wnav{background:#fff;border-bottom:1px solid #E3F2FD;padding:4px 8px;display:flex;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.nbtn{background:none;border:none;cursor:pointer;padding:10px;font-size:1.2rem;color:#00A8FF;flex-shrink:0;transition:transform .15s}
.nbtn:hover{transform:scale(1.15)}
.tabs{display:flex;gap:6px;padding:8px 4px;overflow-x:auto;flex:1}
.tabs::-webkit-scrollbar{height:4px}.tabs::-webkit-scrollbar-thumb{background:#B3E5FC;border-radius:4px}
.tab{background:#FFF;border:1px solid #E3F2FD;border-radius:24px;padding:6px 14px;cursor:pointer;font-size:0.8rem;color:#777;white-space:nowrap;flex-shrink:0;transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.02)}
.tab:hover{background:#E6F7FF;color:#00A8FF;border-color:#B3E5FC}
.tab.active{background:#00A8FF;color:#fff;border-color:#00A8FF;font-weight:700;box-shadow:0 2px 6px rgba(0,168,255,.3)}
.tab.twk{border-color:#16A085;color:#16A085}
.tab.active.twk{color:#fff;border-color:#16A085;background:#16A085}
main{padding:16px 12px}
.card{background:#fff;border-radius:20px;padding:16px 12px;box-shadow:0 6px 24px rgba(0,0,0,.06);border:1px solid #F0F4F8;overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.85rem;border-radius:12px;overflow:hidden;border:1px solid #E1E8ED;table-layout:auto}
th{background:#74B9FF;color:#fff;padding:10px 4px;text-align:center;font-size:.8rem;font-weight:700;letter-spacing:.3px;border-bottom:2px solid #0984E3;border-right:1px solid #E1E8ED;white-space:nowrap}
th:last-child{border-right:none}
th.tc{background:#0984E3;border-bottom-color:#0050B3}
td{padding:10px 3px;text-align:center;border-bottom:1px solid #E1E8ED;border-right:1px solid #E1E8ED;color:#2D3436;line-height:1.4;white-space:nowrap}
@media (max-width: 480px) {
  td, th { font-size: 0.75rem; padding: 8px 2px; }
  td.za, td.zb { width: 25px; font-size: 0.7rem; }
}
td:last-child{border-right:none}
tr:last-child td{border-bottom:none}
td.td{background:#E6F7FF;color:#0050B3;font-weight:800}
td.lb{font-weight:700;background:#F1F2F6;color:#2F3542;font-size:.85rem}
td.za{background:#00CEC9;color:#fff;font-size:.8rem;font-weight:800;width:30px;text-shadow:0 1px 1px rgba(0,0,0,.15)}
td.zb{background:#FDCB6E;color:#fff;font-size:.8rem;font-weight:800;width:30px;text-shadow:0 1px 1px rgba(0,0,0,.15)}
td.ga{background:#F8FDFD}
td.gb{background:#FFFCF5}
td.cat{background:#74B9FF;color:#fff;font-weight:800;text-align:center;vertical-align:middle;font-size:.85rem;padding:8px 6px;white-space:nowrap;letter-spacing:.5px}
tr.sep>td{border-top:2px solid #B3E5FC}
.search-bar{background:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #E3F2FD}
.search-bar input{flex:1;border:1.5px solid #B3E5FC;border-radius:24px;padding:8px 16px;font-size:.85rem;outline:none;transition:border-color .2s;font-family:inherit}
.search-bar input:focus{border-color:#00A8FF}
.search-bar button{background:linear-gradient(135deg,#4FACFE,#00F2FE);color:#fff;border:none;border-radius:24px;padding:8px 18px;font-size:.85rem;font-weight:700;cursor:pointer;transition:opacity .2s;white-space:nowrap;font-family:inherit}
.search-bar button:hover{opacity:.85}
.search-bar .s-reset{background:#E1E8ED;color:#555}
.modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:85vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.15);padding:0}
.modal-head{background:linear-gradient(135deg,#4FACFE,#00F2FE);color:#fff;padding:16px 20px;border-radius:20px 20px 0 0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1}
.modal-head h2{font-size:1rem;font-weight:800}
.modal-head button{background:rgba(255,255,255,.25);border:none;color:#fff;font-size:1.1rem;width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-body{padding:16px 20px}
.sr-section{margin-bottom:16px}
.sr-section h3{font-size:.9rem;font-weight:700;color:#0984E3;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid #E3F2FD}
.sr-item{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid #F0F4F8;font-size:.82rem}
.sr-item:last-child{border-bottom:none}
.sr-date{color:#0984E3;font-weight:700;min-width:85px}
.sr-day{background:#E3F2FD;color:#0984E3;border-radius:4px;padding:1px 6px;font-size:.75rem;font-weight:700;min-width:20px;text-align:center}
.sr-detail{color:#2D3436}
.sr-empty{color:#999;font-size:.85rem;text-align:center;padding:24px 0}
.sr-note{margin-top:14px;padding-top:12px;border-top:1px dashed #B3E5FC;font-size:0.75rem;color:#777;line-height:1.6;word-break:keep-all;text-align:justify}
</style>
</head>

}

function dCols(wk){
  var mon=new Date(wk+"T00:00:00"),cols=[];
  for(var i=0;i<5;i++){var d=new Date(mon);d.setDate(mon.getDate()+i);cols.push((d.getMonth()+1)+"/"+(d.getDate()));}
  return cols;
}

function mkTh(wk){
  var cols=dCols(wk),ti=todayCol(wk),s="";
  for(var i=0;i<5;i++) s+="<th"+(i===ti?" class=\"tc\"":"")+">"+L.days[i]+"<br><small>"+cols[i]+"</small></th>";
  return s;
}

function mkTds(arr,ti,sub){
  var s="";
  for(var i=0;i<5;i++) {
    var c = [];
    if(sub) c.push(sub);
    if(i===ti) c.push("td");
    s+="<td"+(c.length?" class=\""+c.join(" ")+"\"":"")+">"+arr[i]+"</td>";
  }
  return s;
}

function renderTabs(){
  var tm=getMonday(),html="";
  for(var i=0;i<weeks.length;i++){
    var wk=weeks[i],active=(i===cur),isTw=(wk===tm);
    var cls="tab"+(active?" active":"")+(isTw?" twk":"");
    var lbl=wkLabel(wk)+(isTw?" ("+L.today+")":"");
    html+="<button class=\""+cls+"\" onclick=\"go("+i+")\">"+lbl+"</button>";
  }
  document.getElementById("tabs").innerHTML=html;
}

function renderContent(){
  var wk=weeks[cur],ti=todayCol(wk),tm=getMonday();
  var yw=yd[wk]||{},gw=gpd[wk]||{};
  var isTw=(wk===tm);
  document.getElementById("hT").textContent=L.title;
  document.getElementById("hS").textContent=wkLabel(wk)+(isTw?" ("+L.twk+")":"");

  var aw=(amd[wk])||["-","-","-","-","-"];
  var html="<thead><tr><th>"+L.cat+"</th><th>"+L.grade+"</th><th>"+L.zone+"</th>"+mkTh(wk)+"</tr></thead><tbody>";

  // 아침 등교지도 (1 row)
  html+="<tr class=\"sep\"><td class=\"cat\" rowspan=\"1\">"+L.am+"</td><td class=\"lb\" colspan=\"2\">"+L.teacher+"</td>"+mkTds(aw,ti)+"</tr>";

  // 급식지도 (6 rows)
  for(var g=1;g<=3;g++){
    var gz=(gw[g])||{A:["-","-","-","-","-"],B:["-","-","-","-","-"]};
    if(g===1){
      html+="<tr class=\"sep\"><td class=\"cat\" rowspan=\"6\">"+L.gp+"</td><td class=\"lb\" rowspan=\"2\">"+g+L.grade+"</td><td class=\"za\">A</td>"+mkTds(gz.A,ti,"ga")+"</tr>";
    } else {
      html+="<tr><td class=\"lb\" rowspan=\"2\">"+g+L.grade+"</td><td class=\"za\">A</td>"+mkTds(gz.A,ti,"ga")+"</tr>";
    }
    html+="<tr><td class=\"zb\">B</td>"+mkTds(gz.B,ti,"gb")+"</tr>";
  }

  // 야자감독 (3 rows)
  for(var g=1;g<=3;g++){
    var a=(yw[g])||["-","-","-","-","-"];
    if(g===1){
      html+="<tr class=\"sep\"><td class=\"cat\" rowspan=\"3\">"+L.yaja+"</td><td class=\"lb\" colspan=\"2\">"+g+L.grade+"</td>"+mkTds(a,ti)+"</tr>";
    } else {
      html+="<tr><td class=\"lb\" colspan=\"2\">"+g+L.grade+"</td>"+mkTds(a,ti)+"</tr>";
    }
  }

  html+="</tbody>";
  document.getElementById("mainT").innerHTML=html;
}

function go(i){cur=i;renderTabs();renderContent();}
function move(d){var n=cur+d;if(n>=0&&n<weeks.length)go(n);}

function doSearch(){
  var name=document.getElementById('sInput').value.trim();
  if(!name){alert('성함을 입력해주세요.');return;}
  var dayNames=['월','화','수','목','금'];
  var results={am:[],gp:[],yaja:[]};
  for(var w=0;w<weeks.length;w++){
    var wk=weeks[w],cols=dCols(wk);
    // 등교지도
    var aw=amd[wk]||[];
    for(var d=0;d<5;d++){if(aw[d]&&aw[d]===name)results.am.push({wk:wk,date:cols[d],day:dayNames[d]});}
    // 급식지도
    var gw=gpd[wk]||{};
    for(var g=1;g<=3;g++){var gz=gw[g];if(!gz)continue;
      for(var d=0;d<5;d++){if(gz.A&&gz.A[d]&&gz.A[d]===name)results.gp.push({wk:wk,date:cols[d],day:dayNames[d],grade:g,zone:'A'});
        if(gz.B&&gz.B[d]&&gz.B[d]===name)results.gp.push({wk:wk,date:cols[d],day:dayNames[d],grade:g,zone:'B'});}}
    // 야자감독
    var yw=yd[wk]||{};
    for(var g=1;g<=3;g++){var a=yw[g];if(!a)continue;
      for(var d=0;d<5;d++){if(a[d]&&a[d]===name)results.yaja.push({wk:wk,date:cols[d],day:dayNames[d],grade:g});}}
  }
  showResults(name,results);
}

function showResults(name,r){
  var total=r.am.length+r.gp.length+r.yaja.length;
  var html='<div class="modal-bg" onclick="if(event.target===this)closeModal()">';
  html+='<div class="modal">';
  html+='<div class="modal-head"><h2>📋 '+name+' 선생님 일정</h2><button onclick="closeModal()">✕</button></div>';
  html+='<div class="modal-body">';
  if(total===0){html+='<div class="sr-empty">"'+name+'" 선생님의 일정을 찾을 수 없습니다.<br><small>정확한 성함을 입력해주세요.</small></div>';}
  else{
    if(r.am.length){html+='<div class="sr-section"><h3>🌅 등교지도 ('+r.am.length+'회)</h3>';
      for(var i=0;i<r.am.length;i++)html+='<div class="sr-item"><span class="sr-date">'+r.am[i].date+'</span><span class="sr-day">'+r.am[i].day+'</span></div>';
      html+='</div>';}
    if(r.gp.length){html+='<div class="sr-section"><h3>🍽️ 급식지도 ('+r.gp.length+'회)</h3>';
      for(var i=0;i<r.gp.length;i++)html+='<div class="sr-item"><span class="sr-date">'+r.gp[i].date+'</span><span class="sr-day">'+r.gp[i].day+'</span><span class="sr-detail">'+r.gp[i].grade+'학년 '+r.gp[i].zone+'구역</span></div>';
      html+='</div>';}
    if(r.yaja.length){html+='<div class="sr-section"><h3>🌙 야자감독 ('+r.yaja.length+'회)</h3>';
      for(var i=0;i<r.yaja.length;i++)html+='<div class="sr-item"><span class="sr-date">'+r.yaja[i].date+'</span><span class="sr-day">'+r.yaja[i].day+'</span><span class="sr-detail">'+r.yaja[i].grade+'학년</span></div>';
      html+='</div>';}
  }
  html+='<div class="sr-note">※ 유의사항: 본 일정 일람표는 원안 배정 자료를 근거로 작성되었으며, 학사 운영 현황 및 현장 사정에 따라 실제 운영 시 탄력적으로 변동될 수 있음을 고지합니다.</div>';
  html+='</div></div></div>';
  document.getElementById('modalArea').innerHTML=html;
}

function closeModal(){document.getElementById('modalArea').innerHTML='';}
function clearSearch(){document.getElementById('sInput').value='';closeModal();}

window.onload=function(){
  var tm=getMonday(),idx=weeks.indexOf(tm);
  cur=(idx>=0?idx:0);
  renderTabs();renderContent();
  var activeTab=document.getElementById("tabs").children[cur];
  if(activeTab) activeTab.scrollIntoView({block:"nearest",inline:"center"});
};
</script>
</body>
</html>
